<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>공룡 점프 챌린지 2026 | #TeamGemini</title>
  
  <!-- Favicon and Meta -->
  <link rel="icon" href="/assets/icons/Dino-Dark.png" type="image/png">
  <meta name="theme-color" content="#F8FAFF">
  <meta name="description" content="Team Gemini 공룡 점프 이벤트에서 최고 점수에 도전하고 100% 즉석 복주머니 경품을 획득하세요!">
  
  <!-- OpenGraph Card -->
  <meta property="og:title" content="공룡 점프 챌린지 2026 | #TeamGemini">
  <meta property="og:description" content="장애물을 넘고 최고 기록에 도전하세요! 한 판만 뛰어도 100% 즉석 경품 복주머니 증정">
  <meta property="og:image" content="/assets/logos/03_TeamGemini_Logo_Ambassador_Coloured.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/scratch.css">
</head>
<body>

  <!-- Mobile Container Wrapper (Max 440px) -->
  <div id="app-container">
    
    <!-- 2-Second Official Google Student Ambassador Splash Screen -->
    <div id="splash-screen">
      <div class="splash-badge">
        <span>🛡️ Google Student Ambassador 공식 인증</span>
      </div>

      <div class="splash-logos">
        <img class="splash-ambassador-logo" src="/assets/logos/03_TeamGemini_Logo_Ambassador_Coloured.png" alt="Team Gemini Ambassador" onerror="this.src='/assets/logos/01_TeamGemini_Logo.png'">
        <img class="splash-gemini-lockup" src="/assets/logos/googlegemini_lockup_fullcolor.png" alt="Google Gemini" onerror="this.style.display='none'">
      </div>

      <!-- Hop Animation Dino -->
      <div class="splash-dino-track">
        <img class="splash-dino-img" src="/assets/icons/Dino-Dark.png" alt="Dino Runner">
        <div class="splash-dino-shadow"></div>
      </div>

      <!-- 4-Color Google Progress Bar -->
      <div class="splash-progress-container">
        <div id="splash-progress-bar" class="splash-progress-bar"></div>
      </div>

      <div id="splash-status-text" class="splash-status-text">캠퍼스 챌린지 서버 연결 중...</div>
      <div class="splash-sub-text">공식 구글 스튜던트 앰버서더 (Google Student Ambassador)</div>
    </div>
    
    <!-- Top Fixed App Bar -->
    <header class="app-header">
      <div class="brand-logo-area">
        <img src="/assets/logos/03_TeamGemini_Logo_Ambassador_Coloured.png" alt="Team Gemini Ambassador Logo" onerror="this.src='/assets/logos/01_TeamGemini_Logo.png'">
      </div>
      <div class="header-actions">
        <div id="header-ticket-pill" class="ticket-pill">
          🎟️ 1장
        </div>
      </div>
    </header>

    <!-- Main View Dynamic Container -->
    <main id="view-container" class="view-content">
      <!-- Views will be mounted here dynamically by Router -->
    </main>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <div class="nav-item active" data-view="home">
        <span class="icon">🏠</span>
        <span>홈</span>
      </div>
      <div class="nav-item" data-view="ranking">
        <span class="icon">🏆</span>
        <span>랭킹</span>
      </div>
      <div class="nav-item" data-view="claims">
        <span class="icon">🎁</span>
        <span>수령함</span>
      </div>
      <div class="nav-item" data-view="invite">
        <span class="icon">👥</span>
        <span>친구초대</span>
      </div>
      <div class="nav-item" data-view="benefit">
        <span class="icon">💡</span>
        <span>혜택안내</span>
      </div>
    </nav>

  </div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
