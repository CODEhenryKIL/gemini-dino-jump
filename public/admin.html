<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Gemini 공룡 점프 챌린지 - 운영 관리자</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #F1F3F4;
      padding: 24px;
      display: block;
    }
    .admin-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #E0E0E0;
    }
    th {
      background: #F8FAFF;
      font-weight: 700;
      color: #202124;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span class="sticker-badge badge-blue">Admin Console</span>
          <h1 style="font-size: 24px; font-weight: 900; margin-top: 4px;">운영 관리 대시보드</h1>
        </div>
        <a href="/" class="btn btn-secondary btn-sm" style="width: auto;">
          ← 이벤트 홈으로
        </a>
      </div>
    </div>

    <!-- Campaign Status & Overview -->
    <div class="card">
      <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 14px;">⚡ 행사 상태 및 지표</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px;">
        <div style="background: #F8FAFF; padding: 16px; border-radius: 14px; text-align: center;">
          <div style="font-size: 12px; color: var(--text-sub);">현재 행사 상태</div>
          <div id="stat-campaign-status" style="font-size: 20px; font-weight: 900; color: var(--primary); margin-top: 4px;">ACTIVE</div>
        </div>
        <div style="background: #F8FAFF; padding: 16px; border-radius: 14px; text-align: center;">
          <div style="font-size: 12px; color: var(--text-sub);">총 익명 참여자</div>
          <div id="stat-participants" style="font-size: 20px; font-weight: 900; color: #202124; margin-top: 4px;">0명</div>
        </div>
        <div style="background: #F8FAFF; padding: 16px; border-radius: 14px; text-align: center;">
          <div style="font-size: 12px; color: var(--text-sub);">총 플레이 완료 건수</div>
          <div id="stat-games" style="font-size: 20px; font-weight: 900; color: #34A853; margin-top: 4px;">0회</div>
        </div>
      </div>

      <!-- State Change Controls -->
      <div style="display: flex; gap: 10px; align-items: center;">
        <span style="font-size: 13px; font-weight: 700;">상태 변경:</span>
        <button class="btn btn-secondary btn-sm btn-status-set" data-status="ACTIVE" style="width: auto;">정상 진행 (ACTIVE)</button>
        <button class="btn btn-secondary btn-sm btn-status-set" data-status="MAINTENANCE" style="width: auto;">점검 중 (MAINTENANCE)</button>
        <button class="btn btn-secondary btn-sm btn-status-set" data-status="ENDED" style="width: auto;">행사 종료 (ENDED)</button>
      </div>
    </div>

    <!-- Prize Stock & Budget -->
    <div class="card">
      <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 10px;">🎁 경품 재고 및 확률 관리</h2>
      <table>
        <thead>
          <tr>
            <th>경품명</th>
            <th>구분</th>
            <th>총 재고</th>
            <th>예약량</th>
            <th>지급 완료</th>
            <th>잔여 재고</th>
            <th>설정 확률</th>
          </tr>
        </thead>
        <tbody id="prize-stock-body">
          <tr><td colspan="7" style="text-align: center;">로딩 중...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Manual Ticket Ledger Adjustment -->
    <div class="card">
      <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 12px;">🎟️ 게임권 수동 보정 (운영 지원)</h2>
      <div style="display: flex; gap: 10px; align-items: center; max-width: 600px;">
        <input id="adj-participant-id" type="text" placeholder="참여자 ID (예: p_xxx)" style="flex: 2; padding: 10px; border: 1px solid #CCC; border-radius: 10px;">
        <input id="adj-delta" type="number" value="1" placeholder="수량" style="flex: 1; padding: 10px; border: 1px solid #CCC; border-radius: 10px;">
        <button id="btn-adjust-ticket" class="btn btn-primary btn-sm" style="flex: 1; width: auto;">보정 지급</button>
      </div>
    </div>

    <!-- Suspicious Score Verification Monitoring -->
    <div class="card">
      <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 10px;">🛡️ 이상 점수 및 치트 검토 (서버 검증 실패 건)</h2>
      <table>
        <thead>
          <tr>
            <th>세션 ID</th>
            <th>닉네임</th>
            <th>제출 점수</th>
            <th>검증 결과</th>
            <th>조치</th>
          </tr>
        </thead>
        <tbody id="suspicious-scores-body">
          <tr><td colspan="5" style="text-align: center;">이상 기록이 없습니다.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadAdminData() {
      try {
        const res = await fetch('/api/admin/overview');
        const data = await res.json();

        document.getElementById('stat-campaign-status').textContent = data.campaign_status;
        document.getElementById('stat-participants').textContent = data.total_participants + '명';
        document.getElementById('stat-games').textContent = data.total_games + '회';

        // Render prizes table
        const tbody = document.getElementById('prize-stock-body');
        tbody.innerHTML = data.prizes.map(p => {
          const remaining = p.total_stock - (p.reserved_stock + p.issued_stock);
          return `
            <tr>
              <td style="font-weight: 700;">${p.name}</td>
              <td>${p.category}</td>
              <td>${p.total_stock}</td>
              <td>${p.reserved_stock}</td>
              <td>${p.issued_stock}</td>
              <td style="font-weight: 800; color: ${remaining <= 5 ? '#EA4335' : '#34A853'};">${remaining}</td>
              <td>${(p.probability * 100).toFixed(0)}%</td>
            </tr>
          `;
        }).join('');

        // Suspicious scores
        const sRes = await fetch('/api/admin/scores/suspicious');
        const sData = await sRes.json();
        const sBody = document.getElementById('suspicious-scores-body');
        if (sData.suspicious_sessions && sData.suspicious_sessions.length > 0) {
          sBody.innerHTML = sData.suspicious_sessions.map(s => `
            <tr>
              <td>${s.session_id}</td>
              <td>${s.nickname}</td>
              <td style="font-weight: 700; color: #EA4335;">${s.score}점</td>
              <td>${s.verification_result}</td>
              <td><span class="sticker-badge badge-red">검토/제외</span></td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error('Admin load error:', err);
      }
    }

    // Status change
    document.querySelectorAll('.btn-status-set').forEach(btn => {
      btn.onclick = async () => {
        const status = btn.dataset.status;
        await fetch('/api/admin/campaign/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        alert('상태가 ' + status + '로 변경되었습니다.');
        loadAdminData();
      };
    });

    // Ticket Adjust
    document.getElementById('btn-adjust-ticket').onclick = async () => {
      const pId = document.getElementById('adj-participant-id').value.trim();
      const delta = parseInt(document.getElementById('adj-delta').value, 10);
      if (!pId) return alert('참여자 ID를 입력하세요.');

      const res = await fetch('/api/admin/tickets/adjust', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ participant_id: pId, delta })
      });
      const resData = await res.json();
      alert('보정 완료! 새 잔여권: ' + resData.new_balance + '장');
      loadAdminData();
    };

    loadAdminData();
  </script>
</body>
</html>
