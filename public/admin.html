<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>공룡 점프 운영 관리자</title><link rel="stylesheet" href="/css/style.css"><style>
body{background:#f1f3f4;padding:24px;display:block}.admin-container{max-width:1100px;margin:auto;display:flex;flex-direction:column;gap:16px}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{background:#f8faff;padding:14px;border-radius:14px}.metric strong{display:block;font-size:22px;margin-top:5px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls select{padding:10px;border:1px solid #ccc;border-radius:9px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;text-align:left;border-bottom:1px solid #e5e5e5}.hidden{display:none}.status{font-size:13px;color:#5f6368}.error{color:#b3261e}.admin-scroll{overflow:auto}
</style></head><body><main class="admin-container">
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><span class="sticker-badge badge-blue">Admin Console</span><h1 style="font-size:24px;margin-top:4px">공룡 점프 운영 대시보드</h1></div><a href="/" class="btn btn-secondary btn-sm" style="width:auto">이벤트 홈</a></div></section>
<section id="auth-card" class="card"><h2 style="font-size:18px">관리자 로그인</h2><p id="auth-help" class="status">Supabase Auth 계정과 등록된 관리자 권한이 모두 필요합니다.</p><form id="auth-form" class="controls" autocomplete="on"><input id="auth-email" type="email" autocomplete="username" placeholder="이메일" required><input id="auth-password" type="password" autocomplete="current-password" placeholder="비밀번호" required><button class="btn btn-primary btn-sm" style="width:auto" type="submit">로그인</button></form><p id="auth-status" class="status" role="status"></p></section>
<div id="dashboard" class="hidden">
<section class="card"><div class="controls"><label>시작일 <input id="filter-from" type="date"></label><label>종료일 <input id="filter-to" type="date"></label><label>환경 <select id="filter-environment"><option value="local">local</option><option value="test">test</option><option value="preview">preview</option><option value="production">production</option></select></label><label><input id="filter-synthetic" type="checkbox"> 개발·Preview 합성 테스트 데이터 포함</label><button id="btn-refresh" class="btn btn-primary btn-sm" style="width:auto">새로고침</button><button id="btn-logout" class="btn btn-secondary btn-sm" style="width:auto">로그아웃</button></div><p id="period-status" class="status"></p></section>
<section class="card"><h2 style="font-size:18px">기간 요약</h2><div id="totals" class="admin-grid"></div></section>
<section class="card admin-scroll"><h2 style="font-size:18px">화면별 조회·활성 시간·추정 이탈</h2><table><thead><tr><th>화면</th><th>조회</th><th>활성 시간</th><th>추정 이탈</th></tr></thead><tbody id="screens"></tbody></table></section>
<section class="card admin-scroll"><h2 style="font-size:18px">유입 채널</h2><table><thead><tr><th>채널</th><th>참여</th><th>Gemini 클릭</th></tr></thead><tbody id="channels"></tbody></table></section>
<section class="card admin-scroll"><h2 style="font-size:18px">게임 퍼널</h2><table><thead><tr><th>단계</th><th>건수</th><th>전 단계 대비</th></tr></thead><tbody id="funnel"></tbody></table></section>
<section class="card admin-scroll"><h2 style="font-size:18px">추천 및 재고</h2><div class="admin-grid"><div><h3>추천</h3><div id="referrals"></div></div><div><h3>경품 재고</h3><table><thead><tr><th>경품</th><th>가용</th><th>예약</th><th>실지급</th><th>테스트 지급</th><th>만료</th><th>무효</th><th>실패</th></tr></thead><tbody id="inventory"></tbody></table></div></div></section>
<section class="card"><h2 style="font-size:18px">운영 변경</h2><div class="controls"><select id="campaign-status"><option>ACTIVE</option><option>MAINTENANCE</option><option>ENDED</option></select><input id="campaign-reason" placeholder="상태 변경 사유" maxlength="200"><button id="btn-status" class="btn btn-secondary btn-sm" style="width:auto">상태 변경</button></div><div class="controls" style="margin-top:10px"><input id="ticket-participant" placeholder="참여자 ID"><input id="ticket-delta" type="number" min="-100" max="100" value="1"><input id="ticket-reason" placeholder="보정 사유" maxlength="200"><button id="btn-ticket" class="btn btn-secondary btn-sm" style="width:auto">게임권 보정</button></div><p id="mutation-status" class="status"></p></section>
<section class="card"><h2 style="font-size:18px">지표 정의</h2><div id="definitions" class="status"></div></section>
<section class="card admin-scroll"><h2 style="font-size:18px">검증 제외 점수</h2><table><thead><tr><th>세션</th><th>점수</th><th>검증 결과</th><th>시각</th></tr></thead><tbody id="suspicious"></tbody></table></section>
</div></main><script type="module" src="/js/admin.js"></script></body></html>
